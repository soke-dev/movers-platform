<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#120D24" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Figtree:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" />
    <title>Movers Admin</title>
    <script>
      // Light or dark, chosen with the theme button. Set before paint so the page never flashes.
      try {
        var q = location.search.match(/[?&]theme=(dark|light)/);
        var t = q ? q[1] : (document.cookie.match(/(?:^|; )mv-theme=(dark|light)/) || [])[1] || localStorage.getItem('mv-theme');
        if (t === 'dark') document.documentElement.dataset.theme = 'dark';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
